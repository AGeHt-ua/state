<title>Кабінет СБУ «Сова»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: службовий термінал — ліва колона з досьє і навігацією (спільні розділи, робочий простір відділу, керування), праворуч робоча зона. Колір відділу (--dept) маркує його простір. Одна темна тема свідомо. */
:root{
  --bg:#0a0d13; --bg2:#0e131b; --panel:#121924; --panel2:#18212f; --line:#243042; --line2:#2f3d52;
  --fg:#e7e2d7; --muted:#8c96a5; --dim:#5f6a7a;
  --gold:#c9a05a; --gold2:#e2c07f; --gold-ink:#1a1408; --gold-soft:rgba(201,160,90,.12);
  --ok:#5fb37a; --ok-soft:rgba(95,179,122,.13); --warn:#d9a23d; --warn-soft:rgba(217,162,61,.14);
  --bad:#d4605a; --bad-soft:rgba(212,96,90,.14); --info:#6f9fd6; --info-soft:rgba(111,159,214,.14);
  --dept:#e2c07f;
  --display:"Russo One","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);
  background-image:linear-gradient(rgba(201,160,90,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(201,160,90,.025) 1px,transparent 1px);
  background-size:32px 32px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
a{color:var(--gold2)}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:480px;display:grid;gap:18px;justify-items:center;text-align:center}
.login-card img{width:140px;height:140px;filter:drop-shadow(0 10px 30px rgba(201,160,90,.18))}
.login-card h1{font:24px/1.15 var(--display);letter-spacing:.06em}
.login-card .sub{color:var(--muted);margin:-8px 0 0}
.login form{width:100%;display:grid;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:4px;position:relative}
.login form::before{content:"ДОСТУП ОБМЕЖЕНО";position:absolute;top:-9px;right:14px;font:500 10px/1 var(--mono);letter-spacing:.14em;background:var(--bg);color:var(--bad);padding:3px 8px;border:1px solid var(--bad)}
.term{width:100%;font:12.5px/1.7 var(--mono);text-align:left;color:var(--muted)}
.term div{white-space:pre-wrap;overflow-wrap:anywhere}
.term .ok{color:var(--ok)} .term .bad{color:var(--bad)} .term .gold{color:var(--gold2)} .term .warn{color:var(--warn)}
.demo{width:100%;display:grid;gap:8px}
.demo-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.demo button{background:var(--bg2);border:1px dashed var(--line2);border-left:3px solid var(--dc,var(--line2));border-radius:4px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;gap:2px}
.demo button:hover{border-color:var(--gold);border-left-color:var(--dc,var(--gold))}
.demo b{font-weight:600;font-size:13px} .demo span{font-size:11.5px;color:var(--muted)}
.fine{font-size:12px;color:var(--dim);max-width:56ch;margin:0}

/* forms */
label.f{display:grid;gap:5px;font-size:12px;color:var(--muted);min-width:0}
label.f>span{letter-spacing:.04em}
input.i,select.i,textarea.i{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:3px;padding:9px 11px;color:var(--fg);min-width:0}
textarea.i{resize:vertical;min-height:72px}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);padding:8px 14px;border-radius:3px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:600}
.btn.gold:hover{background:var(--gold2)}
.btn.ok{border-color:rgba(95,179,122,.5);color:var(--ok)} .btn.ok:hover{background:var(--ok-soft)}
.btn.bad{border-color:rgba(212,96,90,.5);color:var(--bad)} .btn.bad:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form-grid .wide{grid-column:1/-1}
.err{color:var(--bad);font-size:12.5px;margin:0}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}

/* shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}
.side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center}
.brand img{width:46px;height:46px}
.brand b{display:block;font:20px/1 var(--display);letter-spacing:.12em;color:var(--gold2)}
.brand span{font-size:11px;color:var(--muted)}
.me{border:1px solid var(--line);border-top:3px solid var(--dept);background:var(--panel);padding:12px;border-radius:4px;display:grid;gap:4px}
.me .nm{font-weight:600}
.me .rk{font-size:12.5px;color:var(--gold2)}
.me .meta{font:12px var(--mono);color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.me .dp{font:500 11px var(--mono);letter-spacing:.08em;color:var(--dept);text-transform:uppercase}
nav.nav{display:grid;gap:2px}
nav.nav .sec{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:12px 10px 6px}
nav.nav .sec i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
nav.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:8px 10px;cursor:pointer;color:var(--muted);border-radius:0 3px 3px 0}
nav.nav button:hover{color:var(--fg);background:var(--panel)}
nav.nav button.on{color:var(--fg);background:var(--panel);border-left-color:var(--nc,var(--gold))}
nav.nav .ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
nav.nav .cnt{margin-left:auto;font:500 11px/1 var(--mono);background:var(--gold);color:var(--gold-ink);padding:3px 6px;border-radius:9px}
.side-foot{margin-top:auto;display:grid;gap:6px}
.side-foot button{background:none;border:1px solid var(--line);color:var(--muted);padding:7px;border-radius:3px;cursor:pointer;font-size:12.5px}
.side-foot button:hover{color:var(--fg);border-color:var(--line2)}

main.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:rgba(10,13,19,.88);backdrop-filter:blur(6px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:inset 0 2px 0 var(--vc,var(--dept))}
.top h2{font:20px/1.1 var(--display);letter-spacing:.04em}
.top .crumbs{font:11px var(--mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.top .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clr{font:500 11px/1 var(--mono);letter-spacing:.1em;border:1px solid var(--gold);color:var(--gold2);padding:6px 9px;border-radius:2px}
.dbadge{font:500 11px/1 var(--mono);letter-spacing:.1em;border:1px solid var(--dept);color:var(--dept);padding:6px 9px;border-radius:2px}
.clock{font:12px var(--mono);color:var(--muted)}
.view{padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}

/* blocks */
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px;min-width:0;display:grid;gap:14px;align-content:start}
.card>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card>header h3{font:15px/1.2 var(--display);letter-spacing:.05em}
.card>header .sp{margin-left:auto}
.card.dept{border-top:2px solid var(--vc,var(--dept))}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:grid;gap:4px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font:26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--dim)}
.tile.accent{border-color:#6b5531;background:linear-gradient(180deg,var(--gold-soft),transparent 70%),var(--panel)}
.tile.accent .v{color:var(--gold2)}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--body);padding:4px 8px;border-radius:2px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-soft)} .chip.wait{color:var(--warn);background:var(--warn-soft)}
.chip.bad{color:var(--bad);background:var(--bad-soft)} .chip.info{color:var(--info);background:var(--info-soft)}
.chip.mute{color:var(--muted);background:rgba(140,150,165,.1)} .chip.gold{color:var(--gold2);background:var(--gold-soft)}
.tag{font:500 11px/1 var(--mono);color:var(--muted);border:1px solid var(--line2);padding:3px 6px;border-radius:2px;white-space:nowrap}
.dtag{font:500 11px/1 var(--mono);padding:3px 6px;border-radius:2px;white-space:nowrap;border:1px solid var(--c);color:var(--c)}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:rgba(255,255,255,.015)}
table.t .r{text-align:right}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:3px}
.bar.ok>i{background:var(--ok)}
.norm{display:grid;gap:6px}
.norm .row{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.checklist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.checklist li{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.checklist li::before{content:"✓";flex:none;width:18px;height:18px;border-radius:2px;display:grid;place-items:center;font-size:11px;background:var(--ok-soft);color:var(--ok)}
.checklist li.no::before{content:"✕";background:var(--bad-soft);color:var(--bad)}
.checklist li.soft::before{content:"!";background:var(--warn-soft);color:var(--warn)}
.checklist li .x{margin-left:auto}
.do-line{font:12.5px/1.5 var(--mono);background:var(--bg2);border:1px solid var(--line);padding:10px 12px;border-radius:3px;display:flex;gap:10px;align-items:center}
.do-line code{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--gold2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);align-items:flex-end}
.tabs button.tb{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted)}
.tabs button.tb.on{color:var(--fg);border-bottom-color:var(--vc,var(--gold))}
.tabs .cnt{font:11px var(--mono);color:var(--gold2);margin-left:4px}
.tabs .end{margin-left:auto;margin-bottom:6px}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:4px}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--gold);padding:6px 10px;background:var(--gold-soft);margin:0}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft);color:#e8b3af}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft);color:#ebd09a}
.note.ok{border-left-color:var(--ok);background:var(--ok-soft);color:#b5dcc1}

/* case & records */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.dossier{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px 16px 14px;display:grid;gap:10px;cursor:pointer;position:relative;text-align:left;width:100%}
.dossier:hover{border-color:var(--gold)}
.dossier::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st,var(--line2))}
.dossier .no{font:500 12px var(--mono);color:var(--gold2);letter-spacing:.05em}
.dossier h4{font:16px/1.25 var(--display);letter-spacing:.02em}
.dossier .meta{display:flex;gap:6px;flex-wrap:wrap}
.stamp{display:inline-block;font:13px/1 var(--display);letter-spacing:.18em;color:var(--bad);border:2px solid var(--bad);padding:6px 10px;transform:rotate(-3deg);opacity:.85}
.case-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.case-head .ttl{flex:1;min-width:220px;display:grid;gap:6px}
.case-head h3{font:22px/1.2 var(--display)}
dl.kv{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr);gap:8px 14px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chain{display:grid;margin:0;padding:0;list-style:none}
.chain li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.chain li::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:1px;background:var(--line2)}
.chain li:last-child::before{display:none}
.chain .dot{width:21px;height:21px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);display:grid;place-items:center;font:11px var(--mono);color:var(--dim)}
.chain li.done .dot{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chain li.cur .dot{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chain .who{font-weight:500} .chain .when{font-size:12px;color:var(--muted)}
.evid{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.evid li{display:flex;gap:10px;align-items:baseline;font-size:13px;background:var(--bg2);border:1px solid var(--line);padding:8px 10px;border-radius:3px;min-width:0}
.evid li a{overflow-wrap:anywhere}
.art-list{display:flex;gap:6px;flex-wrap:wrap}
.art{font:500 12px var(--mono);padding:4px 8px;border-radius:2px;border:1px solid var(--line2)}
.art.sbu{border-color:rgba(95,179,122,.5);color:var(--ok)}
.art.dbr{border-color:rgba(212,96,90,.6);color:var(--bad)}
.art.npu{border-color:rgba(217,162,61,.55);color:var(--warn)}
.rec{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--st,var(--line2));border-radius:3px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.rec .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rec .hd b{font:15px/1.25 var(--display);letter-spacing:.02em}
.rec .hd .sp{margin-left:auto}
.recs{display:grid;gap:12px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.flow .arrow{color:var(--dim)}
pre.report{white-space:pre-wrap;font:12.5px/1.6 var(--mono);background:var(--bg2);border:1px solid var(--line);padding:14px;border-radius:3px;margin:0;max-height:340px;overflow:auto}
.toast{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:50;display:grid;gap:8px}
.toast div{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:3px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:340px;animation:tin .2s ease-out}
.toast div.bad{border-left-color:var(--bad)}
@keyframes tin{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline-form .i{width:auto;flex:1;min-width:140px}

/* кандидати */
.cand-cta{width:100%;display:grid;gap:8px}
.cand-cta button{background:var(--gold-soft);border:1px solid #6b5531;border-radius:4px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.cand-cta button:hover{border-color:var(--gold)}
.cand-cta b{font-weight:600;font-size:13px;color:var(--gold2)} .cand-cta span{font-size:11.5px;color:var(--muted)}
.pub{min-height:100%;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pub-in{max-width:860px;margin:0 auto;display:grid;gap:18px}
.pub-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pub-head img{width:64px;height:64px}
.pub-head h1{font:22px/1.15 var(--display);letter-spacing:.04em}
.pub-head .btn{margin-left:auto}
.rowset{display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--bg2);border:1px solid var(--line);padding:10px;border-radius:3px}
.row>label{flex:1 1 150px}
.row>label.grow{flex:3 1 220px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.step{border-top:3px solid var(--line2);padding-top:8px;font-size:13px;color:var(--muted)}
.step.done{border-color:var(--ok);color:var(--fg)} .step.cur{border-color:var(--warn);color:var(--fg)} .step.bad{border-color:var(--bad);color:var(--fg)}
.big-no{font:34px/1 var(--display);color:var(--gold2);letter-spacing:.06em}
.vchecks{display:grid;gap:6px;font-size:13px}
.vchecks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}

@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
  .me,.side-foot,nav.nav .sec{display:none}
  nav.nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;border-radius:3px 3px 0 0}
  nav.nav button.on{border-bottom-color:var(--nc,var(--gold))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .top,.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  dl.kv{grid-template-columns:minmax(0,1fr)} dl.kv dt{margin-top:6px}
}
@media (max-width:460px){.tiles{grid-template-columns:minmax(0,1fr)}.demo-row{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div class="toast" id="toast" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ============ Discord-ролі (сервер СБУ) — у робочій версії це конфіг бекенду ============ */

function doLogin(id,pw){
 const p=P(id);const L=[];const push=(t,c)=>L.push([t,c]);$("#term").innerHTML="";
 push("> з'єднання з ЄІС «СОВА»...","");
 if(!p||S.pw[p.id]!==pw){push("✕ Невірний Static ID або пароль","bad");return play(L,()=>{})}
 push("✓ облікові дані підтверджено","ok");
 if(p.status==="dismissed"){push("✕ Доступ анульовано: співробітника звільнено","bad");return play(L,()=>{})}
 push(`> Discord @${p.discord}: читаю ролі сервера СБУ...`,"");
 const{rank,depts}=resolveRoles(p.roles);
 push(`  основна: ${p.roles.includes(SBU_ROLE)?SBU_ROLE+" → СБУ":"роль СБУ відсутня"}`,p.roles.includes(SBU_ROLE)?"gold":"bad");
 push(`  звання: ${rank?RANK_ROLES[rank-1]+" → "+rankName(rank):"не знайдено"}`,rank?"gold":"bad");
 push(`  відділ: ${depts.length?depts.map(d=>DEPTS[d].role+" → "+dS(d)).join(", "):"роль відділу відсутня"}`,depts.length?"gold":"warn");
 const a=accessFor(p);
 if(!a.ok){push("✕ Вхід відхилено: "+a.why+". Зверніться до керівництва відділу.","bad");return play(L,()=>{})}
 if(p.roles.includes(PRESS_ROLE))push(`  посада: ${PRESS_ROLE} → Прес-секретар`,"gold");
 if(a.multi)push("! кілька ролей відділів — вхід до першого. Повідомлено Голову","warn");
 const changed=a.rank!==p.rank||a.dept!==p.dept;
 if(changed){push(`! картку синхронізовано з Discord: ${rankName(p.rank)} / ${dS(p.dept)} → ${rankName(a.rank)} / ${dS(a.dept)}`,"warn");}
 push(`✓ робочий простір: ${DEPTS[a.dept].n}`,"ok");
 push(`> рівень допуску: ${clearance(a.rank)}`,"gold");
 play(L,()=>{if(changed){audit(0,"Синхронізація з Discord",p.id,`${rankName(p.rank)} / ${dS(p.dept)} → ${rankName(a.rank)} / ${dS(a.dept)}`);p.rank=a.rank;p.dept=a.dept;save()}
  me=p;try{sessionStorage.setItem(KEY+"-me",p.id)}catch(e){}UI.view="home";UI.tabs={};UI.appOpen=null;UI.caseOpen=null;UI.caseNew=false;render()});
}
function play(L,done){const term=$("#term");let i=0;const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
 (function step(){if(i>=L.length){setTimeout(done,rm?0:450);return}const d=document.createElement("div");d.textContent=L[i][0];if(L[i][1])d.className=L[i][1];term.appendChild(d);i++;setTimeout(step,rm?0:200)})()}

function opChip(o){return o.st==="done"?'<span class="chip ok">Проведено</span>':o.st==="cancel"?'<span class="chip mute">Скасовано</span>':o.cur?'<span class="chip info">Погоджено куратором</span>':'<span class="chip wait">Планування</span>'}
function opChecks(o){
 const c=S.cases.find(x=>x.id===+o.case);const h=new Date(o.at).getHours()+new Date(o.at).getMinutes()/60;
 const prev=S.ops.filter(x=>x.id!==o.id&&x.org===o.org&&x.st==="done").sort((a,b)=>b.at-a.at)[0];
 return[
  {ok:!!c&&c.stage===4,t:c?`Кейс-файл ${c.no}: ${CASE_STAGES[c.stage]}`:"Кейс-файл не обрано"},
  {ok:h>=16&&h<=22,t:"Час початку в межах 16:00–22:00, тривалість до 90 хв"},
  {ok:o.n>=25&&o.n<=100,t:`Учасників: ${o.n||0} (дозволено 25–100 сумарно)`},
  {ok:!prev||o.at-prev.at>=7*DAY,t:prev?`Останній рейд на «${o.org}»: ${fmtD(prev.at)} (кулдаун 7 діб)`:"Кулдаун 7 діб дотримано"},
  {ok:!!o.notified,t:"Кураторів повідомлено щонайменше за 2 год (Discord)"},
  {ok:!!o.cur,t:"Отримано дозвіл Головного куратора / ГА"}
 ];
}

/* ============ премії ============ */
function bonusCalc(off){
 const rows=S.people.filter(p=>p.status!=="dismissed").map(p=>({p,pt:pts(p.id,off),blocked:activeRep(p.id).length>0,n:S.acts.filter(a=>a.by===p.id&&a.st==="ok"&&inWeek(a.t,off)).length}));
 const total=rows.filter(r=>!r.blocked).reduce((s,r)=>s+r.pt,0);
 rows.forEach(r=>{r.cap=S.caps[RANKS[r.p.rank-1].g];r.raw=r.blocked||!total?0:S.fund*r.pt/total;r.pay=Math.min(r.raw,r.cap)});
 rows.sort((a,b)=>b.pt-a.pt);return{rows,total,paid:rows.reduce((s,r)=>s+r.pay,0)};
}

const VVB_CHECKS=["Особу і Static ID підтверджено","Паспорт, медкарту і військовий квиток звірено з базою","Судимості й розшук перевірено за базою правопорядку","Чорний список держслужби перевірено","Задеклароване майно та авто звірено з реєстрами","Зв'язків із кримінальними формуваннями не виявлено"];
const REJ=["Невідповідність вимогам щодо документів або здоров'я","Зв'язки з кримінальними формуваннями","Непогашена судимість, розшук або Чорний список","Не минув строк після звільнення з держоргану","Завідомо недостовірні відомості про себе","Неадекватна, зухвала або агресивна поведінка на співбесіді","Обґрунтована недовіра керівництва СБУ"];

function appFlags(a){const f=[];const d=a.docs;
 const miss=[!d.passport&&"паспорт",!d.med&&"медична карта",!d.ticket&&"військовий квиток"].filter(Boolean);
 if(miss.length)f.push(["bad",`Неповний пакет документів: ${miss.join(", ")} (р. II Регламенту набору).`]);
 if(a.age<18)f.push(["bad","Кандидат неповнолітній."]);
 if(a.wanted)f.push(["bad","Кандидат вказав, що перебуває в розшуку."]);
 if(a.bl)f.push(["bad","Кандидат перебуває в Чорному списку держслужби."]);
 if(a.conv.length)f.push(["warn",`Задекларовано судимостей: ${a.conv.length}. Перевірте, чи всі погашені: непогашена судимість — підстава для відмови.`]);
 a.prev.forEach(p=>{if(!p.left)return;const h=(Date.now()-p.left)/HOUR;const ngu=/НГУ/.test(p.org)&&/штаб|старшина|лейтенант|капітан|майор|полковник/i.test(p.rank);
  if(h<24&&!ngu)f.push(["bad",`Звільнений з ${p.org} ${Math.floor(h)} год тому. Прийом можливий не раніше ніж через 1 календарний день (п. 3.2 Регламенту, п. 1.35 Правил).`])});
 if(a.crime)f.push(["warn","Задекларовано зв'язки з кримінальним середовищем — перевірте."]);
 if(a.property.length+a.cars.length>=4)f.push(["","Значне майно: звірте з реєстрами та джерелами доходів."]);
 return f;}

 return `<div class="grid2" style="gap:24px">
  <dl class="kv"><dt>Static ID</dt><dd class="mono">${esc(a.sid)}</dd><dt>Вік</dt><dd>${a.age}</dd><dt>Discord</dt><dd class="mono">@${esc(a.discord)}</dd><dt>Телефон (IC)</dt><dd class="mono">${esc(a.phone||"—")}</dd>

   <dt>Розшук / ЧС</dt><dd>${a.wanted?'<span class="chip bad">У розшуку</span>':'<span class="chip ok">Не в розшуку</span>'} ${a.bl?'<span class="chip bad">У ЧС</span>':'<span class="chip ok">Не в ЧС</span>'}</dd>
   <dt>Сім'я / організація</dt><dd>${esc(a.family||"—")}</dd><dt>Зв'язки з криміналом</dt><dd>${esc(a.crime||"не задекларовано")}</dd>

  <div style="display:grid;gap:12px;align-content:start">

  <div class="steps">${["Анкету подано","Спецперевірка ВВБ","Співбесіда ВКПП","Наказ про зарахування"].map((l,i)=>`<div class="step ${i<idx?"done":i===idx?(failed?"bad":"cur"):""}">${esc(l)}</div>`).join("")}</div>
  ${a.st==="vvb"?'<p class="note">Анкета на спецперевірці у Відділі внутрішньої безпеки.</p>':""}
  ${a.st==="vkpp"?'<p class="note">Спецперевірку пройдено. Відділ кадрів призначить вам співбесіду.</p>':""}
  ${a.st==="interview"?`<p class="note">Співбесіду призначено на <b>${fmtDT(a.vkpp.at)}</b>. Прийдіть до холу Офісу СБУ з паспортом, медкартою і військовим квитком.</p>`:""}
  ${a.st==="rec"?'<p class="note">Співбесіду пройдено. Очікуйте наказу Голови СБУ.</p>':""}
  ${a.st==="accepted"?'<p class="note ok">Вас зараховано на посаду «Стажер». Тимчасовий пароль до кабінету видасть співробітник ВКПП, ролі в Discord видасть бот.</p>':""}
  ${failed?`<p class="note bad">У прийомі відмовлено. Причина: ${esc((a.st==="vvb_rej"?a.vvb&&a.vvb.reason:a.vkpp&&a.vkpp.reason)||"—")}.</p>`:""}</div>`}

  const arts=parseArts(val("#a-arts"));if(ACT[type].art&&!arts.length){err.textContent="Для затримання вкажіть статті, які оголошено затриманому.";err.hidden=false;return}
  S.acts.push({id:S.n.a++,by:me.id,type,qty:Math.max(1,+val("#a-qty")||1),t:new Date($("#a-t").value).getTime()||Date.now(),arts,subj:val("#a-subj"),ev,note:val("#a-note"),st:"wait",rev:null});
  save();UI.tabs.act="mine";toast("Звіт надіслано керівнику");render()},
 rap:()=>{const type=UI.rapType,data={};
  if(type==="promo"){const pc=promoCheck(me);if(!pc||!pc.eligible)return;data.to=pc.next}
  if(type==="vac"){data.days=Math.min(7,Math.max(1,+val("#r-days")||1));data.from=val("#r-from");data.reason=val("#r-reason")}
  if(type==="dismiss"){data.reason=val("#r-reason");if(!data.reason){toast("Напишіть текст рапорту",1);return}}
  if(type==="transfer"){data.to=val("#r-to");data.reason=val("#r-reason")}
  if(type==="lift"){data.disc=val("#r-disc");data.reason=val("#r-reason")}
  S.raps.push({id:S.n.r++,by:me.id,type,t:Date.now(),st:"wait",data});save();UI.tabs.rap="mine";toast("Рапорт подано");render()},
 req:()=>{const to=val("#q-to");const q={id:S.n.q++,from:isLead(me)?"lead":me.dept,to,type:val("#q-type"),case:+val("#q-case")||null,text:val("#q-text"),by:me.id,t:Date.now(),st:"new"};
  S.reqs.push(q);save();UI.tabs.req="out";toast(`Запит надіслано до ${dS(to)}`);render()},
 reqdone:f=>{const q=find(S.reqs,f);q.st="done";q.reply=val("#rq-r-"+q.id);q.ass=q.ass||me.id;save();toast("Запит виконано, відправника сповіщено");render()},
 reqrej:f=>{const q=find(S.reqs,f);q.st="rej";q.reply="Відхилено: "+val("#rq-x-"+q.id);save();toast("Запит відхилено");render()},
 case:()=>{const n=S.n.c++;const dept=isLead(me)?"orv":me.dept;
  const c={id:n,no:`КФ-СБУ-${String(n).padStart(4,"0")}/26`,title:val("#c-title"),org:val("#c-org"),dept,by:me.id,t:Date.now(),stage:0,grif:val("#c-grif"),goal:val("#c-goal"),arts:parseArts(val("#c-arts")),
   subj:val("#c-subj")||"невстановлені",summary:val("#c-sum"),ev:[],members:[me.id],log:[[me.id,"Створено кейс-файл",Date.now()]]};
  if(val("#c-evd")&&val("#c-evu"))c.ev.push([val("#c-evd"),val("#c-evu")]);
  S.cases.push(c);save();UI.caseNew=false;UI.caseOpen=c.id;toast(`Створено ${c.no}`);render()},
 ev:f=>{const c=find(S.cases,f);c.ev.push([val("#ev-d"),val("#ev-u")]);c.log.push([me.id,"Додано доказ",Date.now()]);save();render()},
 prok:f=>{const c=find(S.cases,f);c.prok=val("#prok-no");c.stage=4;c.log.push([me.id,"Погодження прокурора: "+c.prok,Date.now()]);save();toast("Кейс-файл затверджено");render()},
 rework:f=>{const c=find(S.cases,f);c.rework=val("#rw-t");c.stage=0;c.log.push([me.id,"Повернуто на доопрацювання",Date.now()]);save();toast("Повернуто автору");render()},
 src:()=>{S.sources.push({id:S.n.s++,alias:val("#s-alias"),real:val("#s-real"),handler:me.id,rel:val("#s-rel"),case:+val("#s-case")||null,st:"pause",t:Date.now(),note:val("#s-note")});save();UI.tabs.src="";toast("Джерело зареєстровано");render()},
 block:()=>{const basis=val("#b-basis");const t=Date.now();const days=Math.min(7,Math.max(3,+val("#b-days")||5));
  if(!/^https?:\/\//.test(val("#b-ev"))){toast("Потрібен відеозапис підстав блокування",1);return}
  S.blocks.push({id:S.n.b++,who:val("#b-who"),card:val("#b-card"),basis,doc:val("#b-doc"),ground:+val("#b-ground"),case:+val("#b-case"),t,exp:basis==="ОРД"?t+days*DAY:t+48*HOUR,court:basis==="ОРД",by:me.id,ev:val("#b-ev"),st:"active"});
  addAct(me.id,"block",val("#b-who"));save();UI.tabs.block="active";toast(basis==="ПОСТ"?"Заблоковано на 48 год. Нагадування про клопотання до суду увімкнено":"Заблоковано за ордером");render()},
 blkord:f=>{const x=find(S.blocks,f);const d=Math.min(7,Math.max(3,+val("#bo-d-"+x.id)||5));x.basis="ОРД";x.doc=val("#bo-n-"+x.id);x.court=true;x.exp=Date.now()+d*DAY;save();toast(`Ордер внесено, блокування продовжено на ${d} діб`);render()},
 ops:()=>{const forces=[...document.querySelectorAll('input[name="o-f"]:checked')].map(i=>i.value);
  S.ops.push({id:S.n.o++,case:+val("#o-case"),org:val("#o-org"),at:new Date($("#o-at").value).getTime(),n:+val("#o-n"),forces,st:"plan",lead:me.id,cur:false,notified:false,res:""});save();UI.tabs.ops="plan";toast("План збережено. Повідомте кураторів");render()},
 opdone:f=>{const o=find(S.ops,f);o.st="done";o.res=val("#op-r-"+o.id);addAct(me.id,"raid",o.org);save();toast("Операцію завершено");render()},
 guard:()=>{const team=[...document.querySelectorAll('input[name="g-team"]:checked')].map(i=>+i.value);if(!team.length){toast("Оберіть бійців групи",1);return}
  S.guards.push({id:S.n.g++,alias:val("#g-alias"),kind:val("#g-kind"),basis:val("#g-basis"),case:+val("#g-case")||null,team,until:new Date($("#g-until").value).getTime(),st:"active",t:Date.now()});save();UI.tabs.guard="active";toast("Групу призначено");render()},
 chk:()=>{const kind=val("#k-kind");const k={id:S.n.k++,kind,reason:val("#k-reason"),by:me.id,t:Date.now(),st:"open",result:""};
  if(kind==="internal")k.subj=+val("#k-subj");else{k.name=val("#k-name");if(kind==="candidate")k.sid=val("#k-sid");else k.order=val("#k-order")}
  S.checks.push(k);save();UI.tabs.chk=kind;toast("Перевірку відкрито");render()},
 chkres:f=>{const k=find(S.checks,f);k.result=val("#kr-"+k.id);k.st=val("#ks-"+k.id);addAct(me.id,"check",k.reason);
  if(k.st==="viol")audit(me.id,"Висновок ВВБ",k.subj,"порушення підтверджено, матеріали Голові СБУ");save();toast("Перевірку закрито");render()},
 gov:()=>{const at=new Date($("#gv-at").value).getTime(),text=val("#gv-text");const bad=govChecks(at,text).filter(c=>!c.ok);
  if(bad.length){toast("Не виконано: "+bad[0].t,1);return}S.gov.push({id:S.n.v++,by:me.id,at,text,st:"booked"});save();toast("Хвилю заброньовано");render()},
 disc:()=>{const to=+val("#d-to"),type=val("#d-type"),art=val("#d-art"),t=Date.now();
  const d={id:S.n.d++,to,by:me.id,type,art,t,note:val("#d-note")};if(type==="written"||type==="strict")d.exp=t+7*DAY;
  if(type==="fine"){const v=VIOL.find(x=>x[0]===art);d.sum=+val("#d-sum")||(v&&v[3])||10000;d.paid=false}
  S.disc.push(d);audit(me.id,"Стягнення",to,`${DTYPES[type]} · п. ${art}`);save();
  const w=activeRep(to).filter(x=>x.type==="written").length;toast(w>=3?`${nm(to)}: 3 активні письмові догани — підлягає звільненню`:"Наказ оформлено",w>=3);render()},
 appok:f=>{const a=find(S.apps,f);if(f.querySelectorAll('input[name="vc"]:checked').length<VVB_CHECKS.length){toast("Позначте всі пункти спецперевірки",1);return}
  a.st="vkpp";a.vvb={by:me.id,t:Date.now(),note:val("#ap-n-"+a.id)||"Порушень не виявлено."};a.log.push([me.id,"Спецперевірку ВВБ пройдено, передано до ВКПП",Date.now()]);
  addAct(me.id,"check","Спецперевірка: "+a.name);save();toast("Передано до ВКПП. Бот сповістив відділ");render()},
 appvrej:f=>{const a=find(S.apps,f);a.st="vvb_rej";a.vvb={by:me.id,t:Date.now(),note:"",reason:val("#rj-"+a.id)};a.log.push([me.id,"Відмова за результатами спецперевірки ВВБ",Date.now()]);
  addAct(me.id,"check","Спецперевірка: "+a.name);save();toast("У прийомі відмовлено");render()},
 appsched:f=>{const a=find(S.apps,f);const at=new Date($("#sc-t-"+a.id).value).getTime()||nextAt(1,18),who=+val("#sc-w-"+a.id);a.st="interview";a.vkpp={at,who};
  a.log.push([me.id,`Призначено співбесіду на ${fmtDT(at)}, проводить ${nm(who)}`,Date.now()]);save();toast("Співбесіду призначено. Кандидат побачить час на сторінці статусу");render()},
 appres:f=>{const a=find(S.apps,f);a.st="rec";a.vkpp.note=val("#rs-"+a.id);a.vkpp.res="rec";a.log.push([me.id,"Співбесіду пройдено, рекомендовано до зарахування",Date.now()]);
  addAct(a.vkpp.who,"interview",a.name);save();toast("Подано на наказ Голови СБУ");render()},
 appkrej:f=>{const a=find(S.apps,f);if(a.st==="interview")addAct(a.vkpp.who,"interview",a.name);a.vkpp=Object.assign(a.vkpp||{who:me.id},{reason:val("#rj-"+a.id)});a.st="rejected";
  a.log.push([me.id,"Відмова ВКПП",Date.now()]);save();toast("У прийомі відмовлено");render()},
 pubapply:()=>{const rows=k=>[...document.querySelectorAll(`[data-row="${k}"]`)].map(r=>Object.fromEntries([...r.querySelectorAll("[data-k]")].map(i=>[i.dataset.k,i.value.trim()])));
  const sid=val("#pa-sid");if(S.apps.some(a=>String(a.sid)===sid&&!["vvb_rej","rejected","accepted"].includes(a.st))||P(sid)){toast("Заява з цим Static ID вже розглядається або особа вже на службі",1);return}
  const id=S.n.app++,t=Date.now();
  S.apps.push({id,no:"ЗК-"+String(id).padStart(4,"0"),name:val("#pa-name"),sid,age:+val("#pa-age"),discord:val("#pa-dc").replace(/^@/,""),phone:val("#pa-ph"),
   docs:{passport:$("#pa-d-passport").checked,med:$("#pa-d-med").checked,ticket:$("#pa-d-ticket").checked},
   property:rows("prop").filter(r=>r.desc),cars:rows("car").filter(r=>r.model),conv:rows("conv").filter(r=>r.art),
   prev:rows("prev").map(r=>({org:r.org,rank:r.rank,reason:r.reason,left:r.left?new Date(r.left).getTime():null})).filter(r=>r.rank||r.left),
   wanted:$("#pa-wanted").checked,bl:$("#pa-bl").checked,family:val("#pa-fam"),crime:val("#pa-crime"),motiv:val("#pa-mot"),bio:val("#pa-bio"),st:"vvb",t,log:[[0,"Анкету подано",t]]});
  save();UI.pub="done";UI.pubApp=id;render();scrollTo(0,0)},
 pubstatus:()=>{const no=val("#ps-no").toUpperCase().replace(/\s/g,"").replace(/^ZK/,"ЗК"),sid=val("#ps-sid");UI.pubNo=no;UI.pubSid=sid;
  const a=S.apps.find(x=>x.no===no&&String(x.sid)===sid);UI.pubFound=a?a.id:null;UI.pubErr=a?"":"Заяву не знайдено. Перевірте номер і Static ID.";render()},
 pw:f=>{const p=P(f.dataset.id);S.pw[p.id]=val("#pw-new");p.pwSet=Date.now();UI.pwFor=null;save();toast(`Пароль для №${p.id} змінено`);render()}
};

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-f]");if(!f)return;e.preventDefault();const h=F[f.dataset.f];if(h)h(f)});
document.addEventListener("change",e=>{const t=e.target;const k=t.dataset.change;
 if(k==="raptype"){UI.rapType=t.value;render()}
 if(k==="reqto"){UI.reqTo=t.value;const keep={type:null,text:val("#q-text"),cs:val("#q-case")};render();$("#q-text").value=keep.text;$("#q-case").value=keep.cs}
 if(k==="chkkind"){UI.chkKind=t.value;render()}
 if(k==="svc"){S.serviceMode=t.value;save();toast("Правило вислуги змінено");render()}
 const live=t.closest("[data-live]");if(live){if(live.dataset.live==="ops"){if(t.id==="o-case"){const c=S.cases.find(x=>x.id===+t.value);if(c)$("#o-org").value=c.org}updOps()}if(live.dataset.live==="gov")updGov()}});
document.addEventListener("input",e=>{const t=e.target;
 const live=t.closest("[data-live]");if(live){if(live.dataset.live==="ops")updOps();if(live.dataset.live==="gov")updGov()}
 const k=t.dataset.input;if(!k)return;if(k==="arts")return updJur();
 if(k==="coef")S.coef[t.dataset.id]=Math.max(0,+t.value||0);if(k==="fund")S.fund=Math.max(0,+t.value||0);if(k==="cap")S.caps[t.dataset.id]=Math.max(0,+t.value||0);
 save();clearTimeout(window.__bt);window.__bt=setTimeout(()=>{const y=scrollY,id=t.dataset.id;render();const n=document.querySelector(`[data-input="${k}"]${id?`[data-id="${id}"]`:""}`);if(n){n.focus();const v=n.value;n.value="";n.value=v}scrollTo(0,y)},500)});

render();
})();
</script>
