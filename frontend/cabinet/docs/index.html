<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Документи — State</title>
  <link rel="stylesheet" href="../../assets/styles.css" />
</head>
<body>
  <div class="topbar">Кабінет посадовця</div>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="../../">
        <div class="crest">SA</div>
        <div>
          <h1>STATE | UKRAINE GTA 5 RP</h1>
          <p>Створення та публікація актів</p>
        </div>
      </a>
    </div>
  </header>
  <nav class="nav">
    <div class="nav-inner">
      <a href="../">Кабінет</a>
      <a href="./">Документи</a>
      <a href="#" id="logout">Вийти</a>
    </div>
  </nav>
  <main class="wrap">
    <h2 class="page-title" id="page-h">Документи</h2>
    <section class="card" id="form-card">
      <form id="doc-form">
        <input type="hidden" name="id">
        <table class="meta-table">
          <tr><th>Вид</th><td>
            <select name="type"></select>
          </td></tr>
          <tr><th>Номер</th><td><input name="number" required placeholder="З-18"></td></tr>
          <tr><th>Дата</th><td><input name="date" required></td></tr>
          <tr><th>Назва</th><td><input name="title" required></td></tr>
          <tr><th>Орган</th><td><input name="body" placeholder="Уряд штату Сан-Андреас"></td></tr>
          <tr><th>Статус</th><td>
            <select name="status">
              <option value="draft">Проєкт</option>
              <option value="ok">Чинний (опублікувати)</option>
              <option value="dead">Втратив чинність</option>
            </select>
          </td></tr>
          <tr><th>Текст</th><td><textarea name="text" required></textarea></td></tr>
        </table>
        <div class="form-actions">
          <button class="btn gold" type="submit">Зберегти / опублікувати</button>
          <a class="btn ghost" href="./">До списку</a>
        </div>
        <p class="muted" id="saved-msg"></p>
      </form>
    </section>
    <section class="card" id="list-card" style="margin-top:18px;">
      <h3>Усі акти</h3>
      <div id="doc-list"></div>
    </section>
  </main>
  <script src="../../assets/accounts.js"></script>
  <script src="../../assets/app.js"></script>
  <script src="../../assets/store.js"></script>
  <script>
    const user = requireAuth();
    if (!user) throw new Error("auth");
    const form = document.getElementById("doc-form");
    const typeSel = form.type;
    DOC_TYPES.forEach((t) => {
      const o = document.createElement("option");
      o.value = t; o.textContent = t; typeSel.appendChild(o);
    });
    const params = new URLSearchParams(location.search);
    const editId = params.get("id");
    const showNew = params.has("new") || editId;
    if (editId) {
      const doc = getDoc(editId);
      if (doc) {
        form.id.value = doc.id;
        form.type.value = doc.type;
        form.number.value = doc.number;
        form.date.value = doc.date;
        form.title.value = doc.title;
        form.body.value = doc.body || "";
        form.status.value = doc.status;
        form.text.value = doc.text || "";
        document.getElementById("page-h").textContent = "Редагування акта";
      }
    } else if (showNew) {
      form.date.value = new Date().toISOString().slice(0, 10);
      form.body.value = "Уряд штату Сан-Андреас";
      document.getElementById("page-h").textContent = "Новий акт";
    } else {
      document.getElementById("form-card").style.display = "none";
    }
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const doc = {
        id: form.id.value || newDocId(),
        type: form.type.value,
        number: form.number.value.trim(),
        date: form.date.value,
        title: form.title.value.trim(),
        body: form.body.value.trim(),
        status: form.status.value,
        text: form.text.value,
        author: user.username,
        seeded: false
      };
      saveDoc(doc);
      document.getElementById("saved-msg").textContent =
        doc.status === "ok" ? "Опубліковано. Документ уже в законодавчій базі." : "Збережено як проєкт.";
      location.href = pathTo("acts/view/?id=" + encodeURIComponent(doc.id));
    });
    document.getElementById("doc-list").innerHTML = allDocs().map((d) => `
      <article class="act-row">
        <div class="act-num">${d.number}<br>${d.date}</div>
        <div>
          <h3><a href="${docHref(d)}">${d.title}</a></h3>
          <div class="act-meta">${d.type} · ${d.author || ""}</div>
        </div>
        <span>
          <span class="badge ${badgeClass(d.status)}">${DOC_STATUSES[d.status]}</span>
          <a class="btn ghost" href="?id=${encodeURIComponent(d.id)}">Редагувати</a>
        </span>
      </article>
    `).join("") + `<p class="form-actions"><a class="btn gold" href="?new=1">Створити акт</a></p>`;
  </script>
</body>
</html>
