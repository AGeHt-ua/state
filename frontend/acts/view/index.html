<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Документ — State</title>
  <link rel="stylesheet" href="../../assets/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/doc.css" />
  <style>
    .doc-paper { background: #fff; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.06); padding: 20mm 15mm 20mm 25mm; max-width: 210mm; margin: 0 auto; overflow-x: auto; }
    @media (max-width: 800px) { .doc-paper { padding: 20px 16px; } }
  </style>
</head>
<body>
  <div class="topbar">Законодавча база штату Сан-Андреас</div>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="../../">
        <div class="crest">SA</div>
        <div>
          <h1>STATE | UKRAINE GTA 5 RP</h1>
          <p>Картка документа</p>
        </div>
      </a>
    </div>
  </header>
  <nav class="nav">
    <div class="nav-inner">
      <a href="../../">Головна</a>
      <a href="../">Законодавча база</a>
    </div>
  </nav>
  <main class="wrap article" id="doc-root"></main>
  <footer class="footer"><div class="footer-inner"><span>© 2026 State | Ukraine GTA 5 RP</span></div></footer>
  <script src="../../assets/accounts.js"></script>
  <script src="../../assets/app.js"></script>
  <script src="../../assets/store.js"></script>
  <script>
    // HTML із редактора канцелярії: лишаємо розмітку, прибираємо скрипти та обробники подій.
    function safeHtml(html) {
      const doc = new DOMParser().parseFromString(String(html), "text/html");
      doc.body.querySelectorAll("script,style,iframe,object,embed,link,meta,form,input,button,textarea").forEach((el) => el.remove());
      doc.body.querySelectorAll("*").forEach((el) => {
        Array.from(el.attributes).forEach((a) => {
          const v = a.value.trim().toLowerCase();
          if (/^on/i.test(a.name) || a.name === "contenteditable" || ((a.name === "href" || a.name === "src") && v.startsWith("javascript:"))) el.removeAttribute(a.name);
        });
      });
      return doc.body.innerHTML;
    }
    const id = new URLSearchParams(location.search).get("id");
    const doc = getDoc(id);
    const root = document.getElementById("doc-root");
    if (!doc) {
      root.innerHTML = "<h2 class='page-title'>Документ не знайдено</h2><p><a href='../'>До списку</a></p>";
    } else {
      document.title = doc.title;
      root.innerHTML = `
        <div class="crumbs"><a href="../../">Головна</a> / <a href="../">Законодавча база</a> / ${doc.number}</div>
        <h2 class="page-title">${doc.title}</h2>
        <table class="meta-table">
          <tr><th>Вид</th><td>${doc.type}</td></tr>
          <tr><th>Номер</th><td>${doc.number}</td></tr>
          <tr><th>Дата</th><td>${doc.date}</td></tr>
          <tr><th>Статус</th><td><span class="badge ${badgeClass(doc.status)}">${DOC_STATUSES[doc.status]}</span></td></tr>
          <tr><th>Орган</th><td>${doc.body || "—"}</td></tr>
          <tr><th>Автор</th><td>${doc.author || "—"}</td></tr>
        </table>
        ${doc.html
          ? `<div class="doc-paper"><div class="doc-content">${safeHtml(doc.html)}</div></div>`
          : `<div>${String(doc.text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>")}</div>`}
      `;
    }
  </script>
</body>
</html>
