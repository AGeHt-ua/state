<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Очікування ролі — State</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/logos/u-original.svg?v=20260929f" />
  <link rel="stylesheet" href="../../assets/styles.css?v=20260929f" />
</head>
<body>
  <div class="topbar">Кабінет</div>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="../../">
        <img class="crest crest-logo" src="../../assets/logos/u-original.svg?v=20260929f" alt="STATE">
        <div>
          <h1>STATE | UKRAINE GTA 5 RP</h1>
          <p>Заявка на розгляді</p>
        </div>
      </a>
    </div>
  </header>
  <main class="wrap">
    <h2 class="page-title">Очікується призначення ролі</h2>
    <section class="card">
      <p>Заявку прийнято. Губернатор штату Сан-Андреас побачить вас в адмін-панелі й призначить апарат, роль та посаду.</p>
      <p class="muted" id="who"></p>
    </section>
  </main>
  <script src="../../assets/accounts.js?v=20260929f"></script>
  <script src="../../assets/app.js?v=20260929f"></script>
  <script src="../../assets/store.js?v=20260929f"></script>
  <script>
    const user = currentUser();
    if (!user) location.href = pathTo("cabinet/portal/");
    else if (isCabinetUser(user)) location.href = pathTo("cabinet/");
    else document.getElementById("who").textContent = user.username + " · " + user.login;
  </script>
</body>
</html>
