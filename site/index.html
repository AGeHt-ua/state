<style>
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .soon{opacity:.45;cursor:default}
  .soon .cnt{background:var(--line2);color:var(--muted)}
  .botstate{font:12px var(--mono);color:var(--muted)}
  .botstate.ok{color:var(--ok)} .botstate.bad{color:var(--bad)}
  .files{display:flex;gap:6px;flex-wrap:wrap}
</style>
