<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Кабінет — State</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div class="topbar" id="top-office">Службовий кабінет</div>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="../">
        <div class="crest">SA</div>
        <div>
          <h1>STATE | UKRAINE GTA 5 RP</h1>
          <p id="hdr-office">Кабінет</p>
        </div>
      </a>
    </div>
  </header>
  <nav class="nav">
    <div class="nav-inner">
      <a href="../">Головна</a>
      <a href="../acts/">Законодавча база</a>
      <a href="./">Кабінет</a>
      <a href="#" id="logout">Вийти</a>
    </div>
  </nav>
  <main class="wrap">
    <div class="cabinet-layout">
      <aside class="side-nav">
        <a class="active" href="./">Профіль</a>
        <a href="chancery/">Канцелярія</a>
        <a href="docs/">Опубліковані документи</a>
        <a href="people/" id="nav-people">Учасники</a>
        <a href="../acts/">Законодавча база</a>
      </aside>
      <section class="card">
        <h2 class="page-title" style="margin-top:0" id="page-h">Профіль</h2>
        <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">
          <div>
            <img class="profile-photo" id="avatar" alt="Фото" src="">
            <p class="muted" style="margin-top:8px">Фото на бланках</p>
            <input type="file" id="photo" accept="image/*">
          </div>
          <table class="meta-table" style="flex:1;min-width:260px">
            <tr><th>Ім’я</th><td id="f-name">—</td></tr>
            <tr><th>Логін</th><td id="f-login">—</td></tr>
            <tr><th>Апарат управління</th><td id="f-office">—</td></tr>
            <tr><th>Посада</th><td id="f-post">—</td></tr>
            <tr><th>Номер паспорта</th><td id="f-pass">—</td></tr>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="../assets/accounts.js"></script>
  <script src="../assets/app.js"></script>
  <script src="../assets/store.js"></script>
  <script>
    const user = requireAuth();
    if (user) {
      const title = officeTitle(user);
      document.getElementById("top-office").textContent = title;
      document.getElementById("hdr-office").textContent = title;
      document.getElementById("page-h").textContent = title;
      document.getElementById("f-name").textContent = user.username;
      document.getElementById("f-login").textContent = user.login;
      document.getElementById("f-office").textContent = title;
      document.getElementById("f-post").textContent = user.post || "не вказано";
      document.getElementById("f-pass").textContent = user.passport || "не вказано";
      const img = document.getElementById("avatar");
      img.src = user.photo || "";
      if (!user.photo) img.alt = "немає фото";
      if ((user.roles || [])[0] !== "governor") {
        document.getElementById("nav-people").style.display = "none";
      }
      document.getElementById("photo").addEventListener("change", (ev) => {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = () => {
          const full = allUsers().find((u) => u.login === user.login);
          saveUser(Object.assign({}, full, { photo: r.result }));
          img.src = r.result;
        };
        r.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
