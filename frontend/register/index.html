<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Реєстрація — State</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div class="topbar">Офіційний портал Уряду штату Сан-Андреас</div>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="../">
        <div class="crest">SA</div>
        <div>
          <h1>STATE | UKRAINE GTA 5 RP</h1>
          <p>Заявка на доступ</p>
        </div>
      </a>
    </div>
  </header>
  <nav class="nav">
    <div class="nav-inner">
      <a href="../">Головна</a>
      <a href="../login/">Вхід</a>
    </div>
  </nav>
  <main class="wrap">
    <h2 class="page-title">Реєстрація учасника</h2>
    <section class="card">
      <p class="lead">Після реєстрації Губернатор призначає апарат управління. Посаду вказуєте самі; змінити її може адміністратор.</p>
      <form id="reg-form">
        <table class="meta-table">
          <tr><th>Ігрове ім’я</th><td><input name="name" required placeholder="Dominic Castro"></td></tr>
          <tr><th>Посада</th><td><input name="post" required placeholder="Голова Верховного Суду"></td></tr>
          <tr><th>Логін</th><td><input name="login" required placeholder="castro"></td></tr>
          <tr><th>Пароль</th><td><input name="password" type="password" required></td></tr>
        </table>
        <p class="lead" id="reg-msg"></p>
        <button class="btn gold" type="submit">Подати заявку</button>
      </form>
    </section>
  </main>
  <footer class="footer"><div class="footer-inner"><span>© 2026 State | Ukraine GTA 5 RP</span></div></footer>
  <script src="../assets/accounts.js"></script>
  <script src="../assets/app.js"></script>
  <script src="../assets/store.js"></script>
  <script>
    document.getElementById("reg-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const data = new FormData(e.target);
      const res = registerUser({
        name: data.get("name"),
        post: data.get("post"),
        login: data.get("login"),
        password: data.get("password")
      });
      const box = document.getElementById("reg-msg");
      if (!res.ok) {
        box.style.color = "#8a2b2b";
        box.textContent = res.error;
        return;
      }
      loginWithPassword(String(data.get("login")).trim().toLowerCase(), data.get("password"));
      location.href = pathTo("cabinet/pending/");
    });
  </script>
</body>
</html>
