<svg xmlns="http://www.w3.org/2000/svg" width="828" height="1024" viewBox="-10 -12 220 272" role="img" aria-label="Знак U зі зіркою">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#6aa2ff"/>
      <stop offset=".45" stop-color="#3474ec"/>
      <stop offset="1" stop-color="#1d4fcf"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4ab8"/>
      <stop offset="1" stop-color="#0d2c7c"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ebf8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="290">
      <path d="M8 30 L64 6 L136 6 L192 30 L192 146 A92 92 0 0 1 8 146 Z" fill="#fff"/>
      <path d="M8 30 L64 6 L136 6 L192 30 L192 146 A92 92 0 0 1 8 146 Z" fill="#fff" transform="translate(0 12)"/>
      <path d="M58 -14 L82.4 93.7 L29.6 95.1 L71.5 127.3 L56.5 177.9 L100.0 148.0 L143.5 177.9 L128.5 127.3 L170.4 95.1 L117.6 93.7 L142 -14 Z" fill="#000"/>
    </mask>
    <mask id="mf" maskUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="290">
      <path d="M8 30 L64 6 L136 6 L192 30 L192 146 A92 92 0 0 1 8 146 Z" fill="#fff"/>
      <path d="M58 -14 L82.4 93.7 L29.6 95.1 L71.5 127.3 L56.5 177.9 L100.0 148.0 L143.5 177.9 L128.5 127.3 L170.4 95.1 L117.6 93.7 L142 -14 Z" fill="#000"/>
    </mask>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#081a4a" flood-opacity=".35"/></filter>
  </defs>
  <g filter="url(#drop)">
    <!-- Товща (бічні грані): та сама форма, зсунута вниз -->
    <g mask="url(#m)">
      <path d="M8 30 L64 6 L136 6 L192 30 L192 146 A92 92 0 0 1 8 146 Z" fill="url(#side)" transform="translate(0 12)"/>
      <path d="M8 30 L64 6 L136 6 L192 30 L192 146 A92 92 0 0 1 8 146 Z" fill="url(#side)" transform="translate(0 6)"/>
    </g>
    <!-- Лицьова грань -->
    <g mask="url(#mf)">
      <path d="M8 30 L64 6 L136 6 L192 30 L192 146 A92 92 0 0 1 8 146 Z" fill="url(#face)"/>
      <path d="M8 30 L64 6 L136 6 L192 30 L192 146 A92 92 0 0 1 8 146 Z" fill="url(#gloss)"/>
      <!-- Фаска по зовнішньому краю -->
      <path d="M8 30 L64 6 L136 6 L192 30 L192 146 A92 92 0 0 1 8 146 Z" fill="none" stroke="#9cc2ff" stroke-width="6" stroke-opacity=".75"/>
      <!-- Внутрішні стінки вирізу: темні знизу-справа, світлі зверху-зліва -->
      <path d="M58 -14 L82.4 93.7 L29.6 95.1 L71.5 127.3 L56.5 177.9 L100.0 148.0 L143.5 177.9 L128.5 127.3 L170.4 95.1 L117.6 93.7 L142 -14 Z" fill="none" stroke="#0d2c7c" stroke-width="10" stroke-opacity=".75" transform="translate(2 3)"/>
      <path d="M58 -14 L82.4 93.7 L29.6 95.1 L71.5 127.3 L56.5 177.9 L100.0 148.0 L143.5 177.9 L128.5 127.3 L170.4 95.1 L117.6 93.7 L142 -14 Z" fill="none" stroke="#9cc2ff" stroke-width="3" stroke-opacity=".6" transform="translate(-1 -1)"/>
    </g>
  </g>
</svg>
