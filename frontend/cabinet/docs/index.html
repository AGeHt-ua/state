<!DOCTYPE html>
<meta charset="UTF-8">
<title>Документи — State</title>
<!-- «Опубліковані документи» об'єднано з Реєстром; редагування — лише через редактор (з погодженням) -->
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var id = p.get("id");
    location.replace(id && !p.get("action") ? "../create/?id=" + encodeURIComponent(id) : "../all/?status=" + (p.get("trash") ? "trash" : "ok"));
  })();
</script>
<p><a href="../all/">Реєстр документів</a></p>
