<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Сторінку не знайдено — State</title>
  <script>
    // Старі адреси порталу ведуть на сторінки, що їх замінили (закладки й посилання в Discord не ламаються)
    (function () {
      var base = location.pathname.replace(/\/frontend\/.*$/, "/frontend/");
      if (base.indexOf("/frontend/") === -1) return;
      var rest = location.pathname.slice(base.length);
      var q = location.search, h = location.hash;
      var map = [
        [/^cabinet\/chancery\/?/, "cabinet/create/" + q + h],
        [/^cabinet\/(acts|court|docs)\/?/, "cabinet/all/?status=ok"],
        [/^cabinet\/people\/?/, "cabinet/admin/#people"],
        [/^login\/?/, "cabinet/portal/" + q],
        [/^acts\/law-gov-01\/?/, "acts/view/?id=law-gov-01"],
        [/^acts\/decree-warrant-01\/?/, "acts/view/?id=decree-warrant-01"]
      ];
      for (var i = 0; i < map.length; i++) {
        if (map[i][0].test(rest)) { location.replace(base + map[i][1]); return; }
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 Inter, system-ui, sans-serif; background: #f3f5f9; color: #152033; }
    @media (prefers-color-scheme: dark) { body { background: #0a111d; color: #e5eaf2; } a { color: #8fb6ec; } }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    a { color: #1f4a80; }
  </style>
</head>
<body>
  <main>
    <h1>Сторінку не знайдено</h1>
    <p>Можливо, її перенесли. Почніть із <a href="/state/frontend/">головної сторінки порталу</a>.</p>
  </main>
</body>
</html>
