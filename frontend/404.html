<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Сторінку не знайдено — State</title>
  <script>
    // Раніше сайт жив за адресою …/state/frontend/…; тепер уміст frontend лежить у корені.
    (function () {
      var p = location.pathname;
      var i = p.indexOf("/frontend/");
      if (i !== -1) location.replace(p.slice(0, i + 1) + p.slice(i + 10) + location.search + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px Inter, "Segoe UI", Arial, sans-serif; background: #f5f7fb; color: #172033; }
    main { text-align: center; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; color: #0f213d; }
    a { color: #173b66; }
  </style>
</head>
<body>
  <main>
    <h1>Сторінку не знайдено</h1>
    <p>Можливо, посилання застаріло.</p>
    <p><a href="/state/">На головну порталу</a></p>
  </main>
</body>
</html>
